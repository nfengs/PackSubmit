server:
  addr: ":8090"
  mode: debug            # debug / release
  static_dir: ""         # 单二进制部署时指向前端构建产物，例如 ../frontend/dist

db:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""           # 通过 PS_DB_PASSWORD 环境变量注入，勿在仓库中提交真实密码
  name: pack_submit
  params: "charset=utf8mb4&parseTime=True&loc=Local"

jwt:
  secret: "dev-only-packsubmit-secret-please-change-in-production"
  ttl_minutes: 120
  refresh_minutes: 20160

storage:
  attachments: storage/attachments

template:
  pack: "templates/包装确认单-模板 20260730.xlsx"

cors:
  allow_origins: []      # 同域部署留空；跨域时列出来源，不支持 *

login:
  max_attempts: 5
  max_ip_attempts: 20
  lock_seconds: 900

migrations:
  dir: migrations
